services:
  db:
    image: docker.io/library/mysql:8.0
    container_name: logikraf-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LK_DB}
      MYSQL_DATABASE: logikraf_v2
    command: ["--default-authentication-plugin=mysql_native_password", "--innodb-buffer-pool-size=64M"]
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${LK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  backend:
    image: localhost/logikraf_backend:sprint2
    container_name: logikraf-backend
    restart: unless-stopped
    env_file: /srv/sites/logikraf/src/.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"
    networks: [app]

networks:
  app:
    driver: bridge

name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Build Go binary
        run: |
          cd ../backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/server ./cmd/
      - uses: actions/upload-artifact@v4
        with:
          name: go-binary
          path: backend/bin/
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /www/wwwroot/logikraf.id
            git pull origin main
            sudo systemctl restart logikraf-server

name: Deploy logikraf.id

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /srv/sites/logikraf/src
            git pull origin main
            # Build the backend+frontend image from source. The Containerfile
            # compiles both the Go API and the React dist into one image, so no
            # systemd unit or /www folder is needed — the site is served from
            # inside the container (podman rootless, no docker daemon).
            podman build -f Containerfile -t localhost/logikraf_backend:sprint2 logikraf-v2/
            # Recreate the running container with the new image.
            podman stop logikraf-backend || true
            podman rm logikraf-backend || true
            podman run -d --name logikraf-backend --restart unless-stopped \
              --network src_app \
              -p 127.0.0.1:8081:8080 \
              --env-file /srv/sites/logikraf/src/.env \
              localhost/logikraf_backend:sprint2

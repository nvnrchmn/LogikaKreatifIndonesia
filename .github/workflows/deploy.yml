name: Deploy logikraf.id

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /home/nvnrchmn/deploy/logikraf/logikraf-v2
            git pull origin main
            cd frontend
            npm ci
            npm run build
            rm -rf /home/nvnrchmn/www/logikraf.id/*
            cp -r dist/* /home/nvnrchmn/www/logikraf.id/
            cd /home/nvnrchmn/deploy/logikraf/logikraf-v2
            CGO_ENABLED=0 go build -o /home/nvnrchmn/bin/logikraf-api ./cmd/server
            sudo systemctl restart logikraf-api

name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Build frontend
      - name: Build frontend
        run: |
          cd logikraf-v2/frontend
          npm ci
          npm run build

      # Build Go binary
      - name: Build Go binary
        run: |
          cd logikraf-v2
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/logikraf-server ./cmd/server/

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            logikraf-v2/frontend/dist/
            logikraf-v2/bin/

      # Deploy to VPS via SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /www/wwwroot/logikraf.id
            git pull origin main
            sudo systemctl restart logikraf-server

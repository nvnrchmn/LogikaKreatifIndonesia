name: Build Template

on:
  push:
    branches: [templates/*]
  workflow_dispatch:
    inputs:
      template_name:
        description: "Template artifact name (no extension)"
        required: true
        default: "template"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logikraf-v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Package artifact
        run: tar -czf ${{ github.workspace }}/${{ inputs.template_name }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.template_name }}
          path: ${{ github.workspace }}/${{ inputs.template_name }}.tar.gz
          retention-days: 1
